name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm check:build
      - name: Ensure generated component docs and Skill references are current
        run: git diff --exit-code -- apps/site/components apps/site/en/components apps/site/ja/components skills/augma/references
      - uses: actions/upload-artifact@v7
        with:
          name: augma-site-${{ github.sha }}
          path: apps/site/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
  browser:
    name: Browser (${{ matrix.browser }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell ${{ matrix.browser }}
      - uses: actions/download-artifact@v8
        with:
          name: augma-site-${{ github.sha }}
          path: apps/site/.vitepress/dist
      - run: pnpm test:browser --project=${{ matrix.browser }} --workers=2 --retries=0
      # Failed browser tests keep a trace (console, network, DOM snapshots); the log alone cannot explain a flaky failure.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.browser }}-${{ github.sha }}
          path: /tmp/augma-playwright-results
          if-no-files-found: ignore
          retention-days: 14
