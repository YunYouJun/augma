name: Prepare or publish packages
# A pushed v* tag (`pnpm release` runs bumpp: bump, commit, tag, push) prepares and
# publishes over npm trusted publishing (OIDC), and attaches the macOS app to the
# tag's GitHub Release. A manual run only prepares artifacts unless `publish` is set
# on a matching tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages to npm (requires a matching version tag)
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact: augma-packages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Require the version tag before publishing
        if: github.event_name == 'push' || inputs.publish
        run: node scripts/check-release.mjs
      - name: Verify public versions without publishing
        run: node scripts/check-release.mjs --prepare
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - name: Ensure generated component docs are current
        run: git diff --exit-code -- apps/site/components
      - name: Pack verified files
        run: pnpm release:pack
      - uses: actions/upload-artifact@v7
        with:
          name: augma-packages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: augma-release-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/site/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
  mac:
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      artifact: augma-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: swift --version
      - run: swift test --package-path apps/mac
      - name: Build the universal app and zip it
        run: pnpm mac:package
      - uses: actions/upload-artifact@v7
        with:
          name: augma-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/mac/dist/Augma-macOS.zip
            apps/mac/dist/Augma-macOS.zip.sha256
          if-no-files-found: error
  # The site links to releases/latest/download/Augma-macOS.zip, so the asset name stays fixed.
  github-release:
    needs: [prepare, mac]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.mac.outputs.artifact }}
          path: macos
      - name: Attach the macOS app to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" macos/* --clobber
          else
            gh release create "$TAG" macos/* --verify-tag --title "$TAG" --generate-notes
          fi
  publish:
    needs: prepare
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release-artifacts
      - name: Verify tag, commit and package checksums
        run: |
          node scripts/check-release.mjs
          node scripts/release-artifacts.mjs verify
      - name: Verify npm supports trusted publishing
        run: |
          node --input-type=module -e "import { execFileSync } from 'node:child_process'; const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm 11.5.1 or newer is required for trusted publishing')"
      # Skips a version that is already public with the same integrity (re-runs, a
      # hand-published first version) and fails on any other existing tarball.
      - name: Publish Core then Vue via trusted publishing
        run: node scripts/publish-artifacts.mjs
      - name: Verify public package versions and integrity
        run: node scripts/check-published.mjs
